# resources/bind_agent_etl_excel.jobs.yml
# Pipeline ETL para archivos Excel - Matriz Empresas
# Compute: Job Cluster (single-node, cost-optimized)

resources:
  jobs:
    excel_bronze_ingest:
      name: bind_agents_etl_excel

      tags:
        project: bind_agents
        source: excel
        pipeline: bronze_silver

      trigger:
        file_arrival:
          url: ${var.excel_input_path_trigger}
          min_time_between_triggers_seconds: 60
          wait_after_last_change_seconds: 120

      # Job Cluster (reutilizable por todas las tasks)
      job_clusters:
        - job_cluster_key: etl_excel_cluster
          new_cluster:
            spark_version: ${var.spark_version}
            node_type_id: ${var.node_type_id}
            num_workers: 0
            data_security_mode: SINGLE_USER
            aws_attributes:
              ebs_volume_count: 1
              ebs_volume_size: 100
              ebs_volume_type: GENERAL_PURPOSE_SSD
            spark_conf:
              spark.master: "local[*, 4]"
              spark.databricks.cluster.profile: singleNode
            custom_tags:
              ResourceClass: SingleNode
              project: bind_agents

      max_concurrent_runs: 1

      tasks:
        # -----------------------
        # TASK 1: Bronze Excel
        # -----------------------
        - task_key: bronze_excel_ingest
          max_retries: 2
          min_retry_interval_millis: 120000
          timeout_seconds: 1800
          job_cluster_key: etl_excel_cluster
          libraries:
            - pypi:
                package: pandas
            - pypi:
                package: openpyxl
          spark_python_task:
            python_file: ../../src/bronze_excel_ingest.py
            parameters:
              - --input_path
              - ${var.excel_input_path}
              - --checkpoint_path
              - ${var.excel_checkpoint_path}
              - --schema_location
              - ${var.excel_schema_location}
              - --bronze_table
              - ${var.bronze_excel_table}
              - --sheet_name
              - ${var.excel_sheet_name}

        # -----------------------
        # TASK 2: Silver Excel
        # -----------------------
        - task_key: silver_excel_transform
          depends_on:
            - task_key: bronze_excel_ingest
          timeout_seconds: 3600
          job_cluster_key: etl_excel_cluster
          libraries:
            - pypi:
                package: pandas
            - pypi:
                package: openpyxl
          spark_python_task:
            python_file: ../../src/silver_excel_transform.py
            parameters:
              - --bronze_table
              - ${var.bronze_excel_table}
              - --silver_table
              - ${var.silver_excel_table}