resources:
  jobs:
    pdf_bronze_ingest:
      name: bind_agents_etl

      tags:
        project: bind_agents
        source: pdf
        pipeline: bronze_silver_gold

      trigger:
        file_arrival:
          url: ${var.input_path_trigger}
          min_time_between_triggers_seconds: 60
          wait_after_last_change_seconds: 120

      # Serverless compute (reutilizable por todas las tasks)
      environments:
        - environment_key: etl_serverless
          spec:
            environment_version: "2"
            dependencies:
              - "databricks-vectorsearch"

      max_concurrent_runs: 1

      tasks:
        # -----------------------
        # TASK 1: Bronze (SERVERLESS)
        # -----------------------
        - task_key: bronze_pdf_ingest
          max_retries: 2
          min_retry_interval_millis: 120000
          timeout_seconds: 1800
          spark_python_task:
            python_file: ../../src/bronze_pdf_ingest.py
            parameters:
              - --input_path
              - ${var.input_path}
              - --checkpoint_path
              - ${var.checkpoint_path}
              - --schema_location
              - ${var.schema_location}
              - --bronze_table
              - ${var.bronze_table}
          environment_key: etl_serverless

        # -----------------------
        # TASK 2: Silver (SERVERLESS)
        # -----------------------
        - task_key: silver_pdf_ocr
          depends_on:
            - task_key: bronze_pdf_ingest
          timeout_seconds: 3600
          spark_python_task:
            python_file: ../../src/silver_pdf_ocr.py
            parameters:
              - --bronze_table
              - ${var.bronze_table}
              - --silver_table
              - ${var.silver_table}
              - --image_output_path
              - ${var.image_output_path}
          environment_key: etl_serverless

        # -----------------------
        # TASK 3: Gold (SERVERLESS)
        # -----------------------
        - task_key: gold_pdf_chunks
          depends_on:
            - task_key: silver_pdf_ocr
          timeout_seconds: 3600
          spark_python_task:
            python_file: ../../src/gold_pdf_chunks.py
            parameters:
              - --silver_table
              - ${var.silver_table}
              - --gold_table
              - ${var.gold_table}
              - --chunk_size_chars
              - ${var.chunk_size_chars}
              - --chunk_overlap_chars
              - ${var.chunk_overlap_chars}
              - --min_chunk_chars
              - ${var.min_chunk_chars}
              - --topic_mode
              - ${var.topic_mode}
          environment_key: etl_serverless
        # -----------------------
        # TASK 4: Embeddings chuncks
        # -----------------------
        - task_key: embeddings
          depends_on:
            - task_key: gold_pdf_chunks
          spark_python_task:
            python_file: ../../src/embeddings_pdf_chunks.py
            parameters:
              - --gold_table
              - ${var.gold_table}
              - --embeddings_table
              - ${var.embeddings_table}
              - --embedding_endpoint
              - ${var.embedding_endpoint}
              - --mode
              - driver
              - --batch_size
              - "96"
          environment_key: etl_serverless
        # -----------------------
        # TASK 5: Vector Search (endpoint + index)
        # -----------------------
        - task_key: vector_search_index
          depends_on:
            - task_key: embeddings
          timeout_seconds: 2400
          spark_python_task:
            python_file: ../../src/vector_search_index.py
            parameters:
              - --vs_endpoint
              - ${var.vs_endpoint}
              - --vs_index_full_name
              - ${var.vs_index_full_name}
              - --source_table
              - ${var.embeddings_table}
              - --primary_key
              - ${var.vs_primary_key}
              - --embedding_column
              - ${var.vs_embedding_column}
              - --pipeline_type
              - ${var.vs_pipeline_type}
              - --poll_seconds
              - ${var.vs_poll_seconds}
              - --endpoint_timeout_seconds
              - ${var.vs_endpoint_timeout_seconds}
              - --index_timeout_seconds
              - ${var.vs_index_timeout_seconds}
              - --ensure_cdf
              - --trigger_sync
          environment_key: etl_serverless


